<!doctype html>
<html lang="ru">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="StudyFlow — умный планировщик учебы"><title>StudyFlow — Учись спокойно</title><link rel="icon" href="assets/favicon.svg" type="image/svg+xml"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head>
<body>
<div id="toast" class="toast"></div>
<div class="app-shell">
<aside class="sidebar"><div class="brand"><div class="brand-mark">S</div><div><div class="brand-name">StudyFlow</div><div class="brand-tagline">Учись спокойно</div></div></div>
<nav class="main-nav"><button class="nav-item active" data-page="dashboard">⌂ Дашборд</button><button class="nav-item" data-page="tasks">✓ Задачи</button><button class="nav-item" data-page="calendar">▦ Календарь</button><button class="nav-item" data-page="plan">◷ План обучения</button><button class="nav-item" data-page="analytics">↗ Аналитика</button><button class="nav-item" data-page="settings">⚙ Настройки</button></nav>
<div class="sidebar-bottom"><div class="mini-progress"><div class="mini-progress-top"><span>Твой прогресс</span><strong id="sidebar-progress">0%</strong></div><div class="progress-track"><div id="sidebar-progress-bar" class="progress-fill"></div></div><small>Продолжай в том же духе!</small></div><button class="demo-reset" id="reset-demo">↻ Сбросить демо</button></div></aside>
<main class="main"><header class="topbar"><button class="mobile-menu" id="mobile-menu">☰</button><div class="breadcrumb" id="breadcrumb">Дашборд</div><div class="topbar-actions"><button class="icon-btn" id="theme-toggle">☾</button><button class="avatar" id="profile-button">А</button></div></header>
<section class="content"><div id="page-dashboard" class="page active"></div><div id="page-tasks" class="page"></div><div id="page-calendar" class="page"></div><div id="page-plan" class="page"></div><div id="page-analytics" class="page"></div><div id="page-settings" class="page"></div></section></main></div>
<div class="modal-backdrop" id="task-modal"><div class="modal"><div class="modal-head"><div><div class="eyebrow">StudyFlow</div><h2 id="modal-title">Новая задача</h2></div><button class="close-btn" data-close-modal>×</button></div><form id="task-form"><input type="hidden" id="task-id"><div class="form-grid"><label class="field field-full"><span>Название</span><input id="task-title" required placeholder="Например: Подготовить лабораторную работу"></label><label class="field"><span>Предмет</span><input id="task-subject" required placeholder="Физика"></label><label class="field"><span>Дедлайн</span><input id="task-deadline" type="date" required></label><label class="field"><span>Время, минут</span><input id="task-duration" type="number" min="15" step="15" value="60" required></label><label class="field"><span>Сложность</span><select id="task-difficulty"><option value="easy">Легко</option><option value="medium" selected>Средне</option><option value="hard">Сложно</option></select></label><label class="field"><span>Приоритет</span><select id="task-priority"><option value="low">Низкий</option><option value="medium" selected>Средний</option><option value="high">Высокий</option></select></label><label class="field"><span>Прогресс, %</span><input id="task-progress" type="number" min="0" max="100" step="10" value="0"></label><label class="field field-full"><span>Описание</span><textarea id="task-description" rows="3" placeholder="Что нужно сделать?"></textarea></label></div><div class="modal-actions"><button type="button" class="btn secondary" data-close-modal>Отмена</button><button type="submit" class="btn primary">Сохранить задачу</button></div></form></div></div>
<script src="app.js"></script></body></html>
